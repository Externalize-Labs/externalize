name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p externalize-core --target wasm32-unknown-unknown --release --locked
      # The browser package, built and run from Node against the mainnet fixture.
      - run: cargo build -p externalize-wasm --target wasm32-unknown-unknown --profile wasm --locked
      - name: wasm-bindgen
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
          wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/wasm/externalize_wasm.wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node crates/externalize-wasm/tests/node.cjs pkg
      - name: Size budget (1 MiB)
        run: test $(stat -c%s pkg/externalize_wasm_bg.wasm) -le 1048576

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120
      - run: rm rust-toolchain.toml
      - run: cargo +1.88 check --workspace --locked

  # Fails if a PR adds the scratch files that clutter many Wave repos.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No stray working files
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)(ISSUE_[0-9]+.*|.*_SUMMARY\.md|IMPLEMENTATION_.*|PR\.md|pr_body\.md|.*\.bak|.*\.orig|tsc-errors\.txt)$' || true)
          if [ -n "$bad" ]; then echo "Remove these files from the PR:"; echo "$bad"; exit 1; fi
