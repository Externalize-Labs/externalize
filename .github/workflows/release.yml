name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release -p externalize-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=externalize-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/externalize${{ matrix.ext }} README.md LICENSE "$name/"
          cp -r trust "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" >/dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: externalize-*.*

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p externalize-wasm --target wasm32-unknown-unknown --profile wasm --locked
      - name: Package for browsers and Node
        run: |
          version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$version" --locked
          for target in web nodejs; do
            name=externalize-wasm-${GITHUB_REF_NAME}-${target}
            wasm-bindgen --target "$target" --out-dir "$name" target/wasm32-unknown-unknown/wasm/externalize_wasm.wasm
            cp LICENSE "$name/"
            tar czf "$name.tar.gz" "$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: externalize-wasm-*.tar.gz

  publish:
    needs: [build, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum externalize-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            externalize-*
            SHA256SUMS
          generate_release_notes: true
