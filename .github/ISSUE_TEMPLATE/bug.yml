name: Bug
description: Something verifies that shouldn't, fails that shouldn't, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Verification bypasses are security issues: report them through SECURITY.md, not here."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command or code, input (bundle, ledger, tx hash), and output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: externalize --version
